<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinzas</title>
<meta name="description" content="Escreva o que precisa soltar. Depois, queime. Nada fica salvo, nada é enviado, nada é lembrado.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Newsreader:ital,wght@0,400;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#0c0a09;
    --ash:#7a7168;
    --ash-dim:#4a443d;
    --paper:#ece3d2;

    --ember:#e0551f;
    --ember-2:#ff9142;
    --ember-dim:#b5401a;

    --paper-bg:#ede2c6;
    --paper-bg-2:#e3d4ab;
    --paper-edge:#d8c795;

    --ink:#2c231a;
    --ink-dim:#8c7f61;
  }

  *{
    box-sizing:border-box;
  }

  html,
  body{
    height:100%;
  }

  body{
    margin:0;
    min-height:100vh;

    background:
      radial-gradient(
        ellipse 900px 600px at 50% 0%,
        #201a14 0%,
        var(--void) 60%
      ),
      var(--void);

    color:var(--paper);
    font-family:'Newsreader',serif;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow-x:hidden;
  }

  #ambient{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;

    width:100%;
    max-width:640px;

    min-height:100vh;

    padding:8vh 24px 10vh;

    display:flex;
    flex-direction:column;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;

    gap:16px;
    flex-wrap:wrap;

    margin-bottom:6vh;
  }

  h1{
    margin:0;

    font-family:'Fraunces',serif;
    font-optical-sizing:auto;

    font-size:clamp(1.4rem,4vw,1.9rem);

    font-weight:500;
    font-style:italic;

    letter-spacing:.01em;

    color:var(--paper);
  }

  .tag{
    font-family:'JetBrains Mono',monospace;

    font-size:.7rem;
    letter-spacing:.14em;
    text-transform:uppercase;

    color:var(--ash);
  }

  main{
    flex:1;

    display:flex;
    flex-direction:column;
  }

  .stage{
    position:relative;

    flex:1;
    min-height:320px;

    display:flex;
  }

  .surface{
    position:relative;

    width:100%;
    min-height:420px;

    overflow:hidden;

    border-radius:14px;

    box-shadow:
      0 40px 90px -35px rgba(0,0,0,.75),
      0 2px 0 rgba(0,0,0,.15);

    background:transparent;

    transition:
      box-shadow .4s ease;
  }

  .surface.burning{
    box-shadow:
      0 40px 100px -30px rgba(0,0,0,.82),
      0 0 55px rgba(224,85,31,.08);
  }

  /*
   * A folha.
   *
   * O clip-path é atualizado durante a queima.
   * A parte de baixo vai sendo consumida pela chama.
   */
  .paper{
    position:absolute;
    inset:0;

    padding:40px 36px;

    overflow:hidden;

    border:1px solid var(--paper-edge);
    border-radius:14px;

    background:
      radial-gradient(
        140% 100% at 15% 0%,
        var(--paper-bg) 0%,
        var(--paper-bg-2) 100%
      );

    z-index:1;

    clip-path:polygon(
      0 0,
      100% 0,
      100% 100%,
      0 100%
    );

    transition:none;
  }

  /*
   * Textura do papel.
   */
  .paper::before{
    content:'';

    position:absolute;
    inset:0;

    pointer-events:none;

    background-image:
      radial-gradient(
        ellipse 180px 130px at 8% 12%,
        rgba(120,90,45,.14),
        transparent 60%
      ),

      radial-gradient(
        ellipse 140px 100px at 92% 20%,
        rgba(120,90,45,.10),
        transparent 60%
      ),

      radial-gradient(
        ellipse 220px 160px at 78% 88%,
        rgba(120,90,45,.13),
        transparent 60%
      ),

      radial-gradient(
        ellipse 160px 120px at 15% 92%,
        rgba(120,90,45,.11),
        transparent 60%
      ),

      radial-gradient(
        ellipse 90px 90px at 55% 45%,
        rgba(120,90,45,.06),
        transparent 60%
      ),

      repeating-linear-gradient(
        0deg,
        rgba(0,0,0,.02) 0px,
        transparent 1px,
        transparent 3px
      ),

      repeating-linear-gradient(
        90deg,
        rgba(0,0,0,.014) 0px,
        transparent 1px,
        transparent 4px
      ),

      radial-gradient(
        120% 120% at 50% 50%,
        transparent 55%,
        rgba(60,42,20,.13) 100%
      );
  }

  textarea{
    position:relative;
    z-index:2;

    width:100%;
    min-height:340px;

    resize:vertical;

    background:transparent;

    border:0;
    outline:0;

    color:var(--ink);

    font-family:'Newsreader',serif;
    font-size:1.18rem;
    line-height:1.7;

    font-style:italic;
    font-weight:400;

    caret-color:var(--ember);
  }

  textarea::placeholder{
    color:var(--ink-dim);
    font-style:italic;
  }

  /*
   * Cópia visual do texto durante a queima.
   */
  .burn-text{
    position:absolute;
    inset:40px 36px;

    z-index:3;

    display:none;

    overflow:hidden;

    color:var(--ink);

    font-family:'Newsreader',serif;
    font-size:1.18rem;
    line-height:1.7;

    font-style:italic;
    font-weight:400;

    white-space:pre-wrap;
    word-wrap:break-word;

    pointer-events:none;
  }

  /*
   * Área carbonizada.
   */
  #char{
    position:absolute;
    inset:0;

    z-index:4;

    pointer-events:none;

    opacity:0;

    background:
      radial-gradient(
        ellipse 120px 30px at 50% 100%,
        rgba(35,22,12,.7),
        transparent 70%
      );
  }

  /*
   * O fogo fica acima do papel.
   */
  #fire{
    position:absolute;
    inset:0;

    z-index:6;

    width:100%;
    height:100%;

    pointer-events:none;
  }

  /*
   * Pequenos restos de cinza.
   */
  #ash{
    position:absolute;
    inset:0;

    z-index:7;

    pointer-events:none;
  }

  .aftermath{
    position:absolute;
    inset:0;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    opacity:0;

    pointer-events:none;
  }

  .aftermath p{
    margin:0;

    font-family:'JetBrains Mono',monospace;
    font-size:.78rem;

    letter-spacing:.1em;
    text-transform:uppercase;

    color:var(--ink-dim);
  }

  footer{
    margin-top:5vh;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:16px;
    flex-wrap:wrap;
  }

  .counter{
    font-family:'JetBrains Mono',monospace;

    font-size:.72rem;
    letter-spacing:.08em;

    color:var(--ash-dim);
  }

  button#burnBtn{
    appearance:none;

    border:1px solid var(--ember-dim);

    background:transparent;

    color:var(--paper);

    font-family:'JetBrains Mono',monospace;

    font-size:.78rem;

    letter-spacing:.12em;
    text-transform:uppercase;

    padding:13px 26px;

    border-radius:2px;

    cursor:pointer;

    display:inline-flex;
    align-items:center;

    gap:10px;

    transition:
      border-color .25s ease,
      background .25s ease,
      box-shadow .25s ease,
      opacity .25s ease;
  }

  button#burnBtn:hover:not(:disabled){
    border-color:var(--ember);

    background:rgba(224,85,31,.08);

    box-shadow:
      0 0 25px rgba(224,85,31,.08);
  }

  button#burnBtn:focus-visible{
    outline:2px solid var(--ember-2);
    outline-offset:3px;
  }

  button#burnBtn:disabled{
    opacity:.35;
    cursor:default;
  }

  .flame-icon{
    width:9px;
    height:13px;

    border-radius:
      50% 45% 55% 45% /
      65% 65% 35% 35%;

    background:
      radial-gradient(
        circle at 50% 72%,
        #fff0a0 0%,
        #ffb32f 27%,
        var(--ember) 65%,
        var(--ember-dim) 100%
      );

    transform-origin:50% 100%;

    animation:flicker 1.1s ease-in-out infinite;

    box-shadow:
      0 0 7px rgba(255,130,40,.5);
  }

  @keyframes flicker{
    0%,100%{
      transform:scale(1) rotate(0);
    }

    25%{
      transform:scale(.8,1.2) rotate(-4deg);
    }

    50%{
      transform:scale(1.1,.9) rotate(3deg);
    }

    75%{
      transform:scale(.9,1.12) rotate(-2deg);
    }
  }

  .note{
    width:100%;
    max-width:640px;

    margin-top:4vh;

    font-family:'JetBrains Mono',monospace;

    font-size:.68rem;
    line-height:1.7;

    letter-spacing:.03em;

    color:var(--ash-dim);
  }

  @media (prefers-reduced-motion:reduce){
    .flame-icon{
      animation:none;
    }
  }

  @media (max-width:520px){

    .surface{
      min-height:380px;
      border-radius:10px;
    }

    .paper{
      min-height:380px;

      padding:26px 22px;

      border-radius:10px;
    }

    .burn-text{
      inset:26px 22px;
    }

    header{
      margin-bottom:5vh;
    }
  }
</style>
</head>

<body>

<canvas id="ambient"></canvas>

<div class="wrap">

  <header>
    <h1>Cinzas</h1>
    <span class="tag">nada fica</span>
  </header>

  <main>

    <div class="stage">

      <div class="surface" id="surface">

        <div class="paper" id="paper">

          <textarea
            id="editor"
            placeholder="Escreva o que você precisa soltar. Ninguém vai ler — nem você, depois."
          ></textarea>

          <div
            class="burn-text"
            id="burnText"
          ></div>

        </div>

        <div id="char"></div>

        <canvas id="fire"></canvas>
        <canvas id="ash"></canvas>

        <div
          class="aftermath"
          id="aftermath"
        >
          <p>queimado. nada foi salvo.</p>
        </div>

      </div>

    </div>

    <footer>

      <span
        class="counter"
        id="counter"
      >
        0 caracteres · 0 salvos, sempre
      </span>

      <button
        id="burnBtn"
        type="button"
        disabled
      >
        <span class="flame-icon"></span>
        <span>queimar</span>
      </button>

    </footer>

  </main>

  <p class="note">
    Este app não tem banco de dados, não tem login, não envia nada pra lugar nenhum.
    O texto existe só na memória da sua aba, enquanto você escreve.
    Ao queimar — ou ao fechar a página — ele desaparece de verdade.
  </p>

</div>

<script>
(() => {

  const editor =
    document.getElementById('editor');

  const burnText =
    document.getElementById('burnText');

  const paper =
    document.getElementById('paper');

  const surface =
    document.getElementById('surface');

  const fireCanvas =
    document.getElementById('fire');

  const ashCanvas =
    document.getElementById('ash');

  const charLayer =
    document.getElementById('char');

  const aftermath =
    document.getElementById('aftermath');

  const burnBtn =
    document.getElementById('burnBtn');

  const counter =
    document.getElementById('counter');

  const reducedMotion =
    window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

  const fctx =
    fireCanvas.getContext('2d');

  const actx =
    ashCanvas.getContext('2d');


  let dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  function resize(){

    const rect =
      surface.getBoundingClientRect();

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    for(const canvas of [
      fireCanvas,
      ashCanvas
    ]){

      canvas.width =
        rect.width * dpr;

      canvas.height =
        rect.height * dpr;

      canvas.style.width =
        rect.width + 'px';

      canvas.style.height =
        rect.height + 'px';
    }

    fctx.setTransform(
      dpr,0,0,dpr,0,0
    );

    actx.setTransform(
      dpr,0,0,dpr,0,0
    );
  }


  window.addEventListener(
    'resize',
    resize
  );

  resize();


  /*
   * ==========================================================
   * CONTADOR
   * ==========================================================
   */

  function updateCounter(){

    const n =
      editor.value.length;

    counter.textContent =
      `${n} ${
        n === 1
          ? 'caractere'
          : 'caracteres'
      } · 0 salvos, sempre`;

    burnBtn.disabled =
      n === 0;
  }


  editor.addEventListener(
    'input',
    updateCounter
  );

  updateCounter();


  /*
   * ==========================================================
   * FOGO
   * ==========================================================
   *
   * Cada "tongue" é uma chama independente.
   * Nada de linha contínua. Cada uma respira, sobe,
   * encolhe e desaparece sozinha.
   */

  let flames = [];
  let sparks = [];
  let smoke = [];
  let ashes = [];

  let fireEdge = [];


  function flameParticle(
    x,
    y,
    size,
    strength = 1
  ){

    flames.push({

      x,
      y,

      baseX:x,
      baseY:y,

      vx:
        (Math.random() - .5) *
        .55,

      vy:
        -(1.2 + Math.random() * 2.2)
        * strength,

      size:
        size *
        (.65 + Math.random() * .7),

      life:1,

      decay:
        .025 +
        Math.random() * .035,

      phase:
        Math.random() *
        Math.PI * 2,

      wobble:
        .4 +
        Math.random() * .9
    });
  }


  function spark(x,y){

    sparks.push({

      x,
      y,

      vx:
        (Math.random() - .5) *
        1.8,

      vy:
        -(1.2 + Math.random() * 3),

      gravity:
        .025 +
        Math.random() * .02,

      size:
        .6 +
        Math.random() * 1.5,

      life:1,

      decay:
        .025 +
        Math.random() * .035
    });
  }


  function smokeParticle(x,y){

    smoke.push({

      x,
      y,

      vx:
        (Math.random() - .5) *
        .35,

      vy:
        -(
          .2 +
          Math.random() * .45
        ),

      size:
        3 +
        Math.random() * 7,

      life:
        .35 +
        Math.random() * .35,

      decay:
        .006 +
        Math.random() * .006,

      phase:
        Math.random() *
        Math.PI * 2
    });
  }


  function ashParticle(x,y){

    ashes.push({

      x,
      y,

      vx:
        (Math.random() - .5) *
        1.2,

      vy:
        -(
          .1 +
          Math.random() * 1.1
        ),

      gravity:
        .018 +
        Math.random() * .025,

      size:
        1 +
        Math.random() * 3,

      rotation:
        Math.random() *
        Math.PI * 2,

      spin:
        (Math.random() - .5) *
        .12,

      life:1,

      decay:
        .008 +
        Math.random() * .012
    });
  }


  function drawFlame(p){

    const life =
      Math.max(
        p.life,
        0
      );

    const s =
      p.size *
      (.55 + life * .55);

    const time =
      performance.now() *
      .006;

    const wobble =
      Math.sin(
        time +
        p.phase
      ) *
      p.wobble *
      s;


    fctx.save();

    fctx.translate(
      p.x,
      p.y
    );

    fctx.rotate(
      p.vx * .08
    );


    /*
     * Glow externo.
     */

    const glow =
      fctx.createRadialGradient(
        wobble,
        -s * .25,
        0,
        wobble,
        0,
        s * 2.6
      );

    glow.addColorStop(
      0,
      `rgba(255,100,20,${.16 * life})`
    );

    glow.addColorStop(
      .55,
      `rgba(230,55,8,${.08 * life})`
    );

    glow.addColorStop(
      1,
      'rgba(100,15,0,0)'
    );

    fctx.fillStyle =
      glow;

    fctx.beginPath();

    fctx.arc(
      wobble,
      0,
      s * 2.6,
      0,
      Math.PI * 2
    );

    fctx.fill();


    /*
     * Corpo da chama.
     */

    const body =
      fctx.createRadialGradient(
        wobble * .15,
        s * .35,
        0,

        wobble,
        -s * .15,
        s * 1.35
      );

    body.addColorStop(
      0,
      `rgba(255,245,190,${.98 * life})`
    );

    body.addColorStop(
      .17,
      `rgba(255,201,55,${.96 * life})`
    );

    body.addColorStop(
      .43,
      `rgba(255,105,20,${.9 * life})`
    );

    body.addColorStop(
      .72,
      `rgba(206,44,8,${.55 * life})`
    );

    body.addColorStop(
      1,
      'rgba(100,10,0,0)'
    );

    fctx.fillStyle =
      body;


    /*
     * Formato orgânico da chama.
     */

    fctx.beginPath();

    fctx.moveTo(
      0,
      s * 1.15
    );

    fctx.bezierCurveTo(
      -s * .85,
      s * .65,

      -s * .7,
      -s * .15,

      wobble * .35,
      -s * 1.55
    );

    fctx.bezierCurveTo(
      wobble * .8,
      -s * .7,

      s * .9,
      -s * .15,

      s * .5,
      s * .55
    );

    fctx.bezierCurveTo(
      s * .3,
      s * .95,

      s * .12,
      s * 1.1,

      0,
      s * 1.15
    );

    fctx.fill();


    /*
     * Núcleo quente.
     */

    fctx.globalAlpha =
      .8 * life;

    fctx.fillStyle =
      '#fff0a0';

    fctx.beginPath();

    fctx.ellipse(
      wobble * .1,
      s * .45,
      s * .22,
      s * .48,
      0,
      0,
      Math.PI * 2
    );

    fctx.fill();

    fctx.restore();
  }


  /*
   * ==========================================================
   * BORDA DO PAPEL
   * ==========================================================
   */

  function buildEdge(
    width,
    height,
    progress
  ){

    const segments = 38;

    const points = [];

    /*
     * A borda sobe de maneira irregular.
     * Cada ponto tem uma "personalidade".
     */

    for(let i=0;i<=segments;i++){

      const x =
        (i / segments) *
        width;

      const noise =
        Math.sin(i * 1.73) * 10 +
        Math.sin(i * .47) * 7 +
        (Math.random() - .5) * 8;

      const y =
        height -
        progress * height +
        noise;

      points.push({
        x,
        y
      });
    }

    fireEdge =
      points;

    /*
     * Mantém somente a parte acima do fogo.
     */

    const polygon = [
      '0 0',
      `${width}px 0`,
      `${width}px ${points[points.length - 1].y}px`
    ];

    for(
      let i=points.length-1;
      i>=0;
      i--
    ){

      polygon.push(
        `${points[i].x}px ${points[i].y}px`
      );
    }

    polygon.push(
      `0 ${points[0].y}px`
    );

    paper.style.clipPath =
      `polygon(${polygon.join(',')})`;
  }


  /*
   * ==========================================================
   * DESENHO DA BORDA CARBONIZADA
   * ==========================================================
   */

  function drawChar(){

    if(!fireEdge.length)
      return;

    fctx.save();

    fctx.lineCap =
      'round';

    fctx.lineJoin =
      'round';


    /*
     * Mancha preta larga.
     */

    fctx.beginPath();

    fireEdge.forEach(
      (p,i) => {

        if(i === 0)
          fctx.moveTo(p.x,p.y);
        else
          fctx.lineTo(p.x,p.y);
      }
    );

    fctx.strokeStyle =
      'rgba(35,20,10,.8)';

    fctx.lineWidth =
      7;

    fctx.shadowColor =
      'rgba(20,10,5,.45)';

    fctx.shadowBlur =
      8;

    fctx.stroke();


    /*
     * Pequena faixa quente.
     */

    fctx.beginPath();

    fireEdge.forEach(
      (p,i) => {

        if(i === 0)
          fctx.moveTo(p.x,p.y);
        else
          fctx.lineTo(p.x,p.y);
      }
    );

    fctx.strokeStyle =
      'rgba(110,32,8,.8)';

    fctx.lineWidth =
      3;

    fctx.shadowBlur =
      4;

    fctx.stroke();

    fctx.restore();
  }


  /*
   * ==========================================================
   * PARTÍCULAS
   * ==========================================================
   */

  function updateParticles(){

    /*
     * Fogo.
     */

    flames.forEach(p => {

      p.phase += .04;

      p.vx +=
        Math.sin(
          p.phase +
          p.y * .025
        ) *
        .012;

      p.x += p.vx;

      p.y += p.vy;

      p.life -= p.decay;

      if(p.life > 0)
        drawFlame(p);
    });

    flames =
      flames.filter(
        p => p.life > 0
      );


    /*
     * Faíscas.
     */

    sparks.forEach(p => {

      p.vy += p.gravity;

      p.x += p.vx;
      p.y += p.vy;

      p.life -= p.decay;

      if(p.life > 0){

        fctx.save();

        fctx.globalCompositeOperation =
          'lighter';

        fctx.shadowColor =
          `rgba(255,100,20,${p.life})`;

        fctx.shadowBlur =
          8;

        fctx.fillStyle =
          `rgba(255,190,80,${p.life})`;

        fctx.beginPath();

        fctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );

        fctx.fill();

        fctx.restore();
      }
    });

    sparks =
      sparks.filter(
        p => p.life > 0
      );


    /*
     * Fumaça.
     */

    smoke.forEach(p => {

      p.x +=
        p.vx +
        Math.sin(
          performance.now() * .001 +
          p.phase
        ) * .08;

      p.y += p.vy;

      p.size += .02;

      p.life -= p.decay;

      if(p.life > 0){

        fctx.save();

        fctx.globalAlpha =
          p.life * .16;

        fctx.fillStyle =
          '#3c3127';

        fctx.filter =
          `blur(${Math.max(
            2,
            p.size * .35
          )}px)`;

        fctx.beginPath();

        fctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );

        fctx.fill();

        fctx.restore();
      }
    });

    smoke =
      smoke.filter(
        p => p.life > 0
      );
  }


  /*
   * ==========================================================
   * CINZAS
   * ==========================================================
   */

  function updateAsh(){

    actx.clearRect(
      0,
      0,
      ashCanvas.width / dpr,
      ashCanvas.height / dpr
    );

    ashes.forEach(p => {

      p.vy += p.gravity;

      p.x +=
        p.vx +
        Math.sin(
          p.y * .03
        ) * .12;

      p.y += p.vy;

      p.rotation += p.spin;

      p.life -= p.decay;

      if(p.life > 0){

        actx.save();

        actx.translate(
          p.x,
          p.y
        );

        actx.rotate(
          p.rotation
        );

        actx.globalAlpha =
          p.life * .8;

        actx.fillStyle =
          Math.random() > .4
            ? 'rgba(75,61,47,.8)'
            : 'rgba(140,123,98,.65)';

        actx.fillRect(
          -p.size / 2,
          -p.size / 2,
          p.size,
          p.size * .7
        );

        actx.restore();
      }
    });

    ashes =
      ashes.filter(
        p => p.life > 0
      );
  }


  /*
   * ==========================================================
   * QUEIMAR
   * ==========================================================
   */

  function burn(){

    if(
      !editor.value ||
      burnBtn.disabled
    )
      return;

    burnBtn.disabled =
      true;

    surface.classList.add(
      'burning'
    );

    const text =
      editor.value;

    burnText.textContent =
      text;

    burnText.style.display =
      'block';

    editor.style.visibility =
      'hidden';


    const rect =
      surface.getBoundingClientRect();

    const textRect =
      burnText.getBoundingClientRect();

    const offsetX =
      textRect.left -
      rect.left;

    const offsetY =
      textRect.top -
      rect.top;

    const width =
      surface.clientWidth;

    const height =
      surface.clientHeight;


    /*
     * 2.2 segundos.
     * O fogo n fica fazendo hora extra.
     */

    const duration =
      reducedMotion
        ? 400
        : 2300;

    const start =
      performance.now();


    /*
     * Começa com vários pontos de fogo.
     */

    const baseCount =
      Math.max(
        11,
        Math.floor(
          width / 34
        )
      );


    function spawnEdgeFlames(){

      if(!fireEdge.length)
        return;

      /*
       * Nem todos os pontos têm chama em todo frame.
       * Isso cria a sensação de fogo vivo.
       */

      for(let i=0;i<baseCount;i++){

        if(
          Math.random() >
          .72
        )
          continue;

        const index =
          Math.floor(
            Math.random() *
            fireEdge.length
          );

        const point =
          fireEdge[index];

        flameParticle(
          point.x +
          (Math.random() - .5) * 14,

          point.y +
          Math.random() * 5,

          5 +
          Math.random() * 10,

          .65 +
          Math.random() * .5
        );
      }


      /*
       * Algumas chamas maiores aparecem
       * aleatoriamente.
       */

      if(Math.random() < .28){

        const index =
          Math.floor(
            Math.random() *
            fireEdge.length
          );

        const point =
          fireEdge[index];

        flameParticle(
          point.x,
          point.y,
          12 +
          Math.random() * 10,
          1
        );
      }
    }


    function frame(now){

      const raw =
        Math.min(
          (now - start) /
          duration,
          1
        );


      /*
       * Acelera um pouco no começo,
       * desacelera no fim.
       */

      const progress =
        1 -
        Math.pow(
          1 - raw,
          1.35
        );


      /*
       * Primeiro constrói a nova borda.
       */

      buildEdge(
        width,
        height,
        progress
      );


      /*
       * Canvas limpo.
       */

      fctx.clearRect(
        0,
        0,
        width,
        height
      );


      /*
       * Carbonização.
       */

      drawChar();


      /*
       * Chamas.
       */

      if(!reducedMotion){

        spawnEdgeFlames();

        if(
          Math.random() < .3 &&
          fireEdge.length
        ){

          const p =
            fireEdge[
              Math.floor(
                Math.random() *
                fireEdge.length
              )
            ];

          spark(
            p.x,
            p.y
          );
        }

        if(
          Math.random() < .045 &&
          fireEdge.length
        ){

          const p =
            fireEdge[
              Math.floor(
                Math.random() *
                fireEdge.length
              )
            ];

          smokeParticle(
            p.x,
            p.y - 5
          );
        }
      }


      updateParticles();


      /*
       * Cinzas começam a escapar das regiões
       * que já foram queimadas.
       */

      if(
        !reducedMotion &&
        raw > .35 &&
        Math.random() < .18
      ){

        const p =
          fireEdge[
            Math.floor(
              Math.random() *
              fireEdge.length
            )
          ];

        ashParticle(
          p.x,
          p.y
        );
      }


      /*
       * No final, o fogo perde força.
       */

      if(raw < 1){

        requestAnimationFrame(
          frame
        );

      }else{

        finish(
          width,
          height
        );
      }
    }


    requestAnimationFrame(
      frame
    );
  }


  /*
   * ==========================================================
   * FINAL
   * ==========================================================
   */

  function finish(
    width,
    height
  ){

    /*
     * Últimos restos.
     */

    if(!reducedMotion){

      for(let i=0;i<18;i++){

        ashParticle(
          Math.random() *
          width,

          height *
          (.35 +
          Math.random() * .35)
        );
      }

      for(let i=0;i<7;i++){

        if(fireEdge.length){

          const p =
            fireEdge[
              Math.floor(
                Math.random() *
                fireEdge.length
              )
            ];

          spark(
            p.x,
            p.y
          );
        }
      }
    }


    /*
     * O texto deixa de existir.
     */

    editor.value =
      '';

    burnText.textContent =
      '';

    burnText.style.display =
      'none';


    /*
     * Some o fogo.
     */

    fctx.clearRect(
      0,
      0,
      width,
      height
    );


    /*
     * O papel volta para a posição original
     * somente depois da mensagem.
     */

    setTimeout(() => {

      aftermath.style.transition =
        'opacity .35s ease';

      aftermath.style.opacity =
        '1';


      setTimeout(() => {

        aftermath.style.opacity =
          '0';


        setTimeout(() => {

          paper.style.clipPath =
            'polygon(0 0,100% 0,100% 100%,0 100%)';

          charLayer.style.opacity =
            '0';

          surface.classList.remove(
            'burning'
          );

          editor.style.visibility =
            'visible';

          updateCounter();

          editor.focus();

        }, 350);

      }, 800);

    }, 100);


    /*
     * Animação curta das cinzas.
     */

    const cleanupStart =
      performance.now();


    function cleanup(now){

      updateAsh();


      if(
        now -
        cleanupStart <
        1000
      ){

        requestAnimationFrame(
          cleanup
        );

      }else{

        ashes = [];

        actx.clearRect(
          0,
          0,
          width,
          height
        );
      }
    }


    if(!reducedMotion){

      requestAnimationFrame(
        cleanup
      );
    }
  }


  burnBtn.addEventListener(
    'click',
    burn
  );


  /*
   * ==========================================================
   * NADA É SALVO
   * ==========================================================
   */

  window.addEventListener(
    'beforeunload',
    () => {
      editor.value = '';
    }
  );


  /*
   * ==========================================================
   * EMBRAS AMBIENTAIS
   * ==========================================================
   */

  const ambient =
    document.getElementById(
      'ambient'
    );

  const ambientCtx =
    ambient.getContext('2d');

  let ambientParticles = [];


  function resizeAmbient(){

    ambient.width =
      window.innerWidth * dpr;

    ambient.height =
      window.innerHeight * dpr;

    ambient.style.width =
      window.innerWidth + 'px';

    ambient.style.height =
      window.innerHeight + 'px';

    ambientCtx.setTransform(
      dpr,0,0,dpr,0,0
    );
  }


  window.addEventListener(
    'resize',
    resizeAmbient
  );

  resizeAmbient();


  function ambientLoop(){

    ambientCtx.clearRect(
      0,
      0,
      window.innerWidth,
      window.innerHeight
    );


    if(
      ambientParticles.length < 24 &&
      Math.random() < .055
    ){

      ambientParticles.push({

        x:
          Math.random() *
          window.innerWidth,

        y:
          window.innerHeight + 10,

        vx:
          (Math.random() - .5) *
          .15,

        vy:
          -(
            .15 +
            Math.random() * .3
          ),

        size:
          .6 +
          Math.random() * 1.3,

        life:
          .15 +
          Math.random() * .35,

        decay:
          .0006 +
          Math.random() * .001
      });
    }


    ambientParticles.forEach(
      p => {

        p.x += p.vx;
        p.y += p.vy;

        p.life -= p.decay;

        if(p.life > 0){

          ambientCtx.beginPath();

          ambientCtx.fillStyle =
            `rgba(
              224,
              85,
              31,
              ${Math.max(
                p.life,
                0
              )}
            )`;

          ambientCtx.shadowColor =
            'rgba(224,85,31,.45)';

          ambientCtx.shadowBlur =
            5;

          ambientCtx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
          );

          ambientCtx.fill();
        }
      }
    );


    ambientParticles =
      ambientParticles.filter(
        p =>
          p.life > 0 &&
          p.y > -10
      );


    requestAnimationFrame(
      ambientLoop
    );
  }


  if(!reducedMotion){
    ambientLoop();
  }

})();
</script>
