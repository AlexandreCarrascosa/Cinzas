<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinzas</title>
<meta name="description" content="Escreva o que precisa soltar. Depois, queime. Nada fica salvo, nada é enviado, nada é lembrado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Newsreader:ital,wght@0,400;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:   #0c0a09;
    --char:   #17130f;
    --char-2: #1f1a15;
    --ash:    #7a7168;
    --ash-dim:#4a443d;
    --paper:  #ece3d2;
    --ember:  #e0551f;
    --ember-2:#ff9142;
    --ember-dim: #b5401a;
    --line: rgba(236,227,210,0.08);

    --paper-bg:   #ede2c6;
    --paper-bg-2: #e3d4ab;
    --paper-edge: #d8c795;
    --ink:        #2c231a;
    --ink-dim:    #8c7f61;
    --char-mark:  #241a10;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 600px at 50% 0%, #201a14 0%, var(--void) 60%),
      var(--void);
    color:var(--paper);
    font-family:'Newsreader', serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }

  /* ambient floating embers in the background */
  #ambient{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    padding:8vh 24px 10vh;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6vh;
    gap:16px;
    flex-wrap:wrap;
  }

  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:500;
    font-style:italic;
    font-size:clamp(1.4rem, 4vw, 1.9rem);
    letter-spacing:0.01em;
    margin:0;
    color:var(--paper);
  }

  .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ash);
    white-space:nowrap;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
  }

  .stage{
    position:relative;
    flex:1;
    min-height:320px;
    display:flex;
  }

  .surface{
    position:relative;
    width:100%;
    background:
      radial-gradient(140% 100% at 15% 0%, var(--paper-bg) 0%, var(--paper-bg-2) 100%);
    border:1px solid var(--paper-edge);
    border-radius:14px;
    box-shadow: 0 40px 90px -35px rgba(0,0,0,0.75), 0 2px 0 rgba(0,0,0,0.15);
    padding:40px 36px;
    display:flex;
    overflow:hidden;
    min-height:420px;
  }

  .surface::before{
    /* aged paper: fibre grain + soft foxing stains + vignette */
    content:'';
    position:absolute; inset:0;
    background-image:
      radial-gradient(ellipse 180px 130px at 8% 12%, rgba(120,90,45,0.14), transparent 60%),
      radial-gradient(ellipse 140px 100px at 92% 20%, rgba(120,90,45,0.10), transparent 60%),
      radial-gradient(ellipse 220px 160px at 78% 88%, rgba(120,90,45,0.13), transparent 60%),
      radial-gradient(ellipse 160px 120px at 15% 92%, rgba(120,90,45,0.11), transparent 60%),
      radial-gradient(ellipse 90px 90px at 55% 45%, rgba(120,90,45,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.014) 0px, transparent 1px, transparent 4px),
      radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(60,42,20,0.13) 100%);
    pointer-events:none;
  }

  textarea{
    width:100%;
    min-height:340px;
    resize:vertical;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'Newsreader', serif;
    font-style:italic;
    font-weight:400;
    font-size:1.18rem;
    line-height:1.7;
    caret-color:var(--ember);
    position:relative;
    z-index:1;
  }

  textarea::placeholder{
    color:var(--ink-dim);
    font-style:italic;
  }

  /* overlay shown during the burn — mirrors the textarea's text, non-interactive */
  .burn-overlay{
    position:absolute;
    inset:40px 36px;
    font-family:'Newsreader', serif;
    font-style:italic;
    font-weight:400;
    font-size:1.18rem;
    line-height:1.7;
    color:var(--ink);
    white-space:pre-wrap;
    word-wrap:break-word;
    overflow:hidden;
    pointer-events:none;
    display:none;
  }

  canvas#embers{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .aftermath{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    opacity:0;
    pointer-events:none;
  }

  .aftermath p{
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  footer{
    margin-top:5vh;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .counter{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.08em;
    color:var(--ash-dim);
  }

  button#burnBtn{
    appearance:none;
    border:1px solid var(--ember-dim);
    background:transparent;
    color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:13px 26px;
    border-radius:2px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease, opacity 0.25s ease;
  }

  button#burnBtn:hover:not(:disabled){
    border-color:var(--ember);
    background:rgba(224,85,31,0.08);
  }

  button#burnBtn:focus-visible{
    outline:2px solid var(--ember-2);
    outline-offset:3px;
  }

  button#burnBtn:disabled{
    opacity:0.35;
    cursor:default;
  }

  .flame{
    width:9px; height:12px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, var(--ember-2), var(--ember) 70%, var(--ember-dim));
    animation: flicker 1.6s ease-in-out infinite;
    transform-origin:50% 100%;
  }

  @keyframes flicker{
    0%,100%{ transform: scale(1) rotate(0deg); }
    30%{ transform: scale(1.05, 0.92) rotate(-3deg); }
    55%{ transform: scale(0.94, 1.08) rotate(2deg); }
    80%{ transform: scale(1.02, 0.97) rotate(-1deg); }
  }

  .note{
    max-width:640px;
    width:100%;
    margin-top:4vh;
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    line-height:1.7;
    letter-spacing:0.03em;
    color:var(--ash-dim);
  }

  @media (prefers-reduced-motion: reduce){
    .flame{ animation:none; }
  }

  @media (max-width:520px){
    .surface{ padding:26px 22px; border-radius:10px; min-height:380px; }
    .burn-overlay{ inset:26px 22px; }
    header{ margin-bottom:5vh; }
  }
</style>
</head>
<body>

<canvas id="ambient"></canvas>

<div class="wrap">
  <header>
    <h1>Cinzas</h1>
    <span class="tag">nada fica</span>
  </header>

  <main>
    <div class="stage">
      <div class="surface" id="surface">
        <textarea id="editor" placeholder="Escreva o que você precisa soltar. Ninguém vai ler — nem você, depois."></textarea>
        <div class="burn-overlay" id="overlay"></div>
        <canvas id="embers"></canvas>
        <div class="aftermath" id="aftermath"><p>queimado. nada foi salvo.</p></div>
      </div>
    </div>

    <footer>
      <span class="counter" id="counter">0 caracteres · 0 salvos, sempre</span>
      <button id="burnBtn" type="button" disabled>
        <span class="flame"></span>
        <span>queimar</span>
      </button>
    </footer>
  </main>

  <p class="note">
    Este app não tem banco de dados, não tem login, não envia nada pra lugar nenhum.
    O texto existe só na memória da sua aba, enquanto você escreve. Ao queimar — ou ao fechar a página — ele desaparece de verdade.
  </p>
</div>

<script>
(function(){
  const editor = document.getElementById('editor');
  const overlay = document.getElementById('overlay');
  const surface = document.getElementById('surface');
  const burnBtn = document.getElementById('burnBtn');
  const counter = document.getElementById('counter');
  const aftermath = document.getElementById('aftermath');
  const embersCanvas = document.getElementById('embers');
  const ectx = embersCanvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function sizeCanvas(){
    const r = surface.getBoundingClientRect();
    embersCanvas.width = r.width * devicePixelRatio;
    embersCanvas.height = r.height * devicePixelRatio;
    embersCanvas.style.width = r.width + 'px';
    embersCanvas.style.height = r.height + 'px';
    ectx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  window.addEventListener('resize', sizeCanvas);
  sizeCanvas();

  function updateCounter(){
    const n = editor.value.length;
    counter.textContent = n + (n === 1 ? ' caractere' : ' caracteres') + ' · 0 salvos, sempre';
    burnBtn.disabled = n === 0;
  }
  editor.addEventListener('input', updateCounter);
  updateCounter();

  let sparks = [];
  function spawnSpark(x, y){
    sparks.push({
      x, y,
      vx: (Math.random()-0.5)*0.7,
      vy: -(0.7 + Math.random()*1.5),
      life: 1,
      decay: 0.008 + Math.random()*0.014,
      size: 1.3 + Math.random()*2.2,
      hue: Math.random() > 0.5 ? '224,85,31' : '255,180,90'
    });
  }

  let ash = [];
  function spawnAsh(x, y, width){
    ash.push({
      x, y,
      vx: (Math.random()-0.5)*0.5,
      vy: 0.3 + Math.random()*0.6,
      gravity: 0.012 + Math.random()*0.01,
      drift: (Math.random()-0.5)*0.02,
      angle: Math.random()*Math.PI*2,
      spin: (Math.random()-0.5)*0.1,
      life: 1,
      decay: 0.004 + Math.random()*0.006,
      size: 1.5 + Math.random()*3,
      tone: Math.random() > 0.4 ? '216,206,182' : '120,100,80'
    });
  }

  function drawSparks(){
    sparks.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy -= 0.005;
      p.life -= p.decay;
      if(p.life > 0){
        ectx.beginPath();
        ectx.fillStyle = `rgba(${p.hue}, ${Math.max(p.life,0)})`;
        ectx.shadowColor = `rgba(${p.hue}, 0.85)`;
        ectx.shadowBlur = 6;
        ectx.arc(p.x, p.y, p.size * Math.max(p.life,0.1), 0, Math.PI*2);
        ectx.fill();
      }
    });
    sparks = sparks.filter(p => p.life > 0);
  }

  function drawAsh(){
    ash.forEach(p=>{
      p.vy += p.gravity * 0.06;
      p.x += p.vx + Math.sin(p.angle)*p.drift*10;
      p.y += p.vy;
      p.angle += p.spin;
      p.life -= p.decay;
      if(p.life > 0){
        ectx.save();
        ectx.globalAlpha = Math.max(p.life, 0);
        ectx.translate(p.x, p.y);
        ectx.rotate(p.angle);
        ectx.fillStyle = `rgb(${p.tone})`;
        ectx.shadowBlur = 0;
        ectx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.7);
        ectx.restore();
      }
    });
    ash = ash.filter(p => p.life > 0);
  }

  function burn(){
    if(!editor.value || burnBtn.disabled) return;
    burnBtn.disabled = true;

    const text = editor.value;
    overlay.textContent = text;
    overlay.style.display = 'block';
    editor.style.visibility = 'hidden';

    const overlayWidth = overlay.clientWidth;
    const totalHeight = overlay.scrollHeight;
    const duration = reducedMotion ? 500 : 3200;
    const start = performance.now();

    const oRect = overlay.getBoundingClientRect();
    const sRect = surface.getBoundingClientRect();
    const PAD_X = oRect.left - sRect.left;
    const PAD_Y = oRect.top - sRect.top;

    // an irregular burning edge: N columns, each with its own jittering height,
    // so the fire eats the paper unevenly instead of a straight line
    const SEGMENTS = 22;
    const segW = overlayWidth / SEGMENTS;
    const jitter = new Array(SEGMENTS + 1).fill(0).map(()=> Math.random());
    const jitterTarget = jitter.slice();

    function edgeY(baseY, i){
      // baseY = the smooth overall progress; jitter[i] pushes that column's
      // flame tongue further up or lags it slightly behind
      return baseY + (jitter[i] - 0.5) * Math.min(baseY * 0.5, 34);
    }

    function frame(now){
      const t = Math.min((now - start) / duration, 1);
      const eased = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; // easeInOutQuad
      const baseY = eased * (totalHeight + 20) - 10;

      // slowly wander the per-column jitter so the edge flickers as it climbs
      for(let i=0;i<jitter.length;i++){
        jitter[i] += (jitterTarget[i] - jitter[i]) * 0.08;
        if(Math.random() < 0.05) jitterTarget[i] = Math.random();
      }

      // build the jagged clip-path polygon (visible = above the flame edge)
      const pts = ['0px 0px', `${overlayWidth}px 0px`];
      for(let i = SEGMENTS; i >= 0; i--){
        const y = Math.max(0, Math.min(totalHeight, edgeY(baseY, i)));
        pts.push(`${Math.round(i*segW)}px ${Math.round(y)}px`);
      }
      overlay.style.clipPath = `polygon(${pts.join(',')})`;

      // char band + glowing jagged flame line, drawn on canvas above the paper
      ectx.clearRect(0,0,embersCanvas.width/devicePixelRatio, embersCanvas.height/devicePixelRatio);

      ectx.save();
      ectx.translate(PAD_X, PAD_Y);

      ectx.beginPath();
      for(let i=0;i<=SEGMENTS;i++){
        const x = i*segW;
        const y = Math.max(0, Math.min(totalHeight, edgeY(baseY, i)));
        if(i===0) ectx.moveTo(x,y); else ectx.lineTo(x,y);
      }
      ectx.lineJoin = 'round';
      ectx.strokeStyle = 'rgba(36,22,12,0.55)';
      ectx.lineWidth = 10;
      ectx.stroke();

      ectx.beginPath();
      for(let i=0;i<=SEGMENTS;i++){
        const x = i*segW;
        const y = Math.max(0, Math.min(totalHeight, edgeY(baseY, i)));
        if(i===0) ectx.moveTo(x,y); else ectx.lineTo(x,y);
      }
      ectx.strokeStyle = 'rgba(255,145,66,0.95)';
      ectx.shadowColor = 'rgba(224,85,31,0.9)';
      ectx.shadowBlur = 14;
      ectx.lineWidth = 2.5;
      ectx.stroke();
      ectx.shadowBlur = 0;

      if(!reducedMotion){
        const emitCount = 1 + Math.floor(Math.random()*2);
        for(let i=0;i<emitCount;i++){
          const seg = Math.floor(Math.random()*SEGMENTS);
          const x = seg*segW + Math.random()*segW;
          const y = Math.max(0, Math.min(totalHeight, edgeY(baseY, seg)));
          spawnSpark(x, y);
        }
        drawSparks();
      }
      ectx.restore();

      if(t < 1){
        requestAnimationFrame(frame);
      }else{
        finish(overlayWidth);
      }
    }

    function finish(width){
      overlay.style.display = 'none';
      overlay.textContent = '';
      overlay.style.clipPath = '';

      // true erase — nothing is retained anywhere, not even in this variable
      editor.value = '';

      if(!reducedMotion){
        for(let i=0;i<46;i++){
          spawnAsh(Math.random()*width, -4 - Math.random()*10, width);
        }
        const settle = setInterval(()=>{
          ectx.save();
          ectx.translate(PAD_X, PAD_Y);
          ectx.clearRect(-PAD_X, -PAD_Y, embersCanvas.width/devicePixelRatio, embersCanvas.height/devicePixelRatio);
          drawSparks();
          drawAsh();
          ectx.restore();
          if(sparks.length === 0 && ash.length === 0) clearInterval(settle);
        }, 30);
      } else {
        ectx.clearRect(0,0,embersCanvas.width/devicePixelRatio, embersCanvas.height/devicePixelRatio);
      }

      aftermath.style.transition = 'opacity 0.6s ease';
      aftermath.style.opacity = '1';

      setTimeout(()=>{
        aftermath.style.opacity = '0';
        setTimeout(()=>{
          editor.style.visibility = 'visible';
          updateCounter();
          editor.focus();
        }, 600);
      }, 1700);
    }

    requestAnimationFrame(frame);
  }

  burnBtn.addEventListener('click', burn);

  // clearing the field on unload too — belt and suspenders, nothing to persist regardless
  window.addEventListener('beforeunload', ()=>{ editor.value=''; });

  /* ---------- faint ambient embers behind everything ---------- */
  const ambient = document.getElementById('ambient');
  const actx = ambient.getContext('2d');
  let aParticles = [];
  function sizeAmbient(){
    ambient.width = window.innerWidth * devicePixelRatio;
    ambient.height = window.innerHeight * devicePixelRatio;
    ambient.style.width = window.innerWidth+'px';
    ambient.style.height = window.innerHeight+'px';
    actx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  window.addEventListener('resize', sizeAmbient);
  sizeAmbient();

  function seedAmbient(){
    if(reducedMotion) return;
    if(aParticles.length < 26 && Math.random() < 0.06){
      aParticles.push({
        x: Math.random()*window.innerWidth,
        y: window.innerHeight + 10,
        vx: (Math.random()-0.5)*0.15,
        vy: -(0.15 + Math.random()*0.3),
        size: 0.6 + Math.random()*1.4,
        life: 0.15 + Math.random()*0.35,
        decay: 0.0006 + Math.random()*0.001
      });
    }
  }

  function loopAmbient(){
    actx.clearRect(0,0,ambient.width,ambient.height);
    seedAmbient();
    aParticles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      actx.beginPath();
      actx.fillStyle = `rgba(224,85,31,${Math.max(p.life,0)})`;
      actx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      actx.fill();
    });
    aParticles = aParticles.filter(p=>p.life>0 && p.y > -10);
    requestAnimationFrame(loopAmbient);
  }
  if(!reducedMotion) loopAmbient();
})();
</script>
</body>
</html>
