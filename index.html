<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinzas</title>
<meta name="description" content="Escreva o que precisa soltar. Depois, queime. Nada fica salvo, nada é enviado, nada é lembrado.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Newsreader:ital,wght@0,400;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#0c0a09;
    --char:#17130f;
    --char-2:#1f1a15;
    --ash:#7a7168;
    --ash-dim:#4a443d;
    --paper:#ece3d2;

    --ember:#e0551f;
    --ember-2:#ff9142;
    --ember-dim:#b5401a;

    --line:rgba(236,227,210,0.08);

    --paper-bg:#ede2c6;
    --paper-bg-2:#e3d4ab;
    --paper-edge:#d8c795;
    --ink:#2c231a;
    --ink-dim:#8c7f61;
    --char-mark:#241a10;
  }

  *{
    box-sizing:border-box;
  }

  html,
  body{
    height:100%;
  }

  body{
    margin:0;

    background:
      radial-gradient(
        ellipse 900px 600px at 50% 0%,
        #201a14 0%,
        var(--void) 60%
      ),
      var(--void);

    color:var(--paper);
    font-family:'Newsreader', serif;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow-x:hidden;
  }

  #ambient{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;

    width:100%;
    max-width:640px;

    padding:8vh 24px 10vh;

    display:flex;
    flex-direction:column;

    min-height:100vh;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;

    margin-bottom:6vh;

    gap:16px;
    flex-wrap:wrap;
  }

  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;

    font-weight:500;
    font-style:italic;

    font-size:clamp(1.4rem, 4vw, 1.9rem);

    letter-spacing:.01em;

    margin:0;

    color:var(--paper);
  }

  .tag{
    font-family:'JetBrains Mono', monospace;

    font-size:.7rem;

    letter-spacing:.14em;

    text-transform:uppercase;

    color:var(--ash);

    white-space:nowrap;
  }

  main{
    flex:1;

    display:flex;
    flex-direction:column;
  }

  .stage{
    position:relative;

    flex:1;

    min-height:320px;

    display:flex;
  }

  /*
   * O surface agora é apenas o recipiente.
   * O papel de verdade fica dentro de .paper-layer,
   * permitindo que ele seja consumido durante a queima.
   */
  .surface{
    position:relative;

    width:100%;

    min-height:420px;

    display:flex;

    overflow:hidden;

    border-radius:14px;

    box-shadow:
      0 40px 90px -35px rgba(0,0,0,.75),
      0 2px 0 rgba(0,0,0,.15);

    background:transparent;

    transition:
      box-shadow .35s ease;
  }

  .surface.burning{
    box-shadow:
      0 40px 100px -30px rgba(0,0,0,.8),
      0 0 50px rgba(224,85,31,.13);
  }

  /*
   * Essa é a folha que será progressivamente mascarada.
   */
  .paper-layer{
    position:absolute;

    inset:0;

    background:
      radial-gradient(
        140% 100% at 15% 0%,
        var(--paper-bg) 0%,
        var(--paper-bg-2) 100%
      );

    border:1px solid var(--paper-edge);

    border-radius:14px;

    padding:40px 36px;

    overflow:hidden;

    z-index:1;

    /*
     * A máscara é controlada pelo JS.
     */
    -webkit-mask-image:none;
    mask-image:none;
  }

  /*
   * Textura antiga do papel.
   */
  .paper-layer::before{
    content:'';

    position:absolute;
    inset:0;

    background-image:
      radial-gradient(
        ellipse 180px 130px at 8% 12%,
        rgba(120,90,45,.14),
        transparent 60%
      ),

      radial-gradient(
        ellipse 140px 100px at 92% 20%,
        rgba(120,90,45,.10),
        transparent 60%
      ),

      radial-gradient(
        ellipse 220px 160px at 78% 88%,
        rgba(120,90,45,.13),
        transparent 60%
      ),

      radial-gradient(
        ellipse 160px 120px at 15% 92%,
        rgba(120,90,45,.11),
        transparent 60%
      ),

      radial-gradient(
        ellipse 90px 90px at 55% 45%,
        rgba(120,90,45,.06),
        transparent 60%
      ),

      repeating-linear-gradient(
        0deg,
        rgba(0,0,0,.02) 0px,
        transparent 1px,
        transparent 3px
      ),

      repeating-linear-gradient(
        90deg,
        rgba(0,0,0,.014) 0px,
        transparent 1px,
        transparent 4px
      ),

      radial-gradient(
        120% 120% at 50% 50%,
        transparent 55%,
        rgba(60,42,20,.13) 100%
      );

    pointer-events:none;

    z-index:0;
  }

  textarea{
    width:100%;

    min-height:340px;

    resize:vertical;

    background:transparent;

    border:none;
    outline:none;

    color:var(--ink);

    font-family:'Newsreader', serif;

    font-style:italic;
    font-weight:400;

    font-size:1.18rem;

    line-height:1.7;

    caret-color:var(--ember);

    position:relative;

    z-index:2;

    transition:
      opacity .15s ease,
      filter .15s ease;
  }

  textarea::placeholder{
    color:var(--ink-dim);

    font-style:italic;
  }

  /*
   * Texto duplicado usado durante a queima.
   */
  .burn-overlay{
    position:absolute;

    inset:40px 36px;

    font-family:'Newsreader', serif;

    font-style:italic;
    font-weight:400;

    font-size:1.18rem;

    line-height:1.7;

    color:var(--ink);

    white-space:pre-wrap;

    word-wrap:break-word;

    overflow:hidden;

    pointer-events:none;

    display:none;

    z-index:3;

    transition:
      filter .12s linear,
      opacity .15s ease;
  }

  /*
   * Canvas do fogo.
   */
  canvas#embers{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:5;
  }

  /*
   * Região de cinzas / queimadura que fica
   * ligeiramente atrás das chamas.
   */
  #scorch{
    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:4;

    opacity:0;

    transition:opacity .15s ease;

    mix-blend-mode:multiply;
  }

  .surface.burning #scorch{
    opacity:1;
  }

  .aftermath{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    opacity:0;

    pointer-events:none;

    z-index:8;
  }

  .aftermath p{
    font-family:'JetBrains Mono', monospace;

    font-size:.78rem;

    letter-spacing:.1em;

    text-transform:uppercase;

    color:var(--ink-dim);

    text-shadow:
      0 1px 0 rgba(255,255,255,.25);
  }

  footer{
    margin-top:5vh;

    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:16px;

    flex-wrap:wrap;
  }

  .counter{
    font-family:'JetBrains Mono', monospace;

    font-size:.72rem;

    letter-spacing:.08em;

    color:var(--ash-dim);
  }

  button#burnBtn{
    appearance:none;

    border:1px solid var(--ember-dim);

    background:transparent;

    color:var(--paper);

    font-family:'JetBrains Mono', monospace;

    font-size:.78rem;

    letter-spacing:.12em;

    text-transform:uppercase;

    padding:13px 26px;

    border-radius:2px;

    cursor:pointer;

    display:inline-flex;

    align-items:center;

    gap:10px;

    transition:
      border-color .25s ease,
      background .25s ease,
      color .25s ease,
      opacity .25s ease,
      box-shadow .25s ease;
  }

  button#burnBtn:hover:not(:disabled){
    border-color:var(--ember);

    background:rgba(224,85,31,.08);

    box-shadow:
      0 0 25px rgba(224,85,31,.08);
  }

  button#burnBtn:focus-visible{
    outline:2px solid var(--ember-2);
    outline-offset:3px;
  }

  button#burnBtn:disabled{
    opacity:.35;
    cursor:default;
  }

  .flame{
    width:9px;
    height:13px;

    position:relative;

    border-radius:
      55% 45% 55% 45% /
      65% 65% 35% 35%;

    background:
      radial-gradient(
        circle at 50% 72%,
        #fff1ad 0%,
        #ffb52f 28%,
        var(--ember) 68%,
        var(--ember-dim) 100%
      );

    transform-origin:50% 100%;

    animation:flicker 1.15s ease-in-out infinite;

    box-shadow:
      0 0 7px rgba(255,130,40,.55);
  }

  @keyframes flicker{
    0%,100%{
      transform:scale(1) rotate(0deg);
    }

    25%{
      transform:scale(.82,1.18) rotate(-4deg);
    }

    50%{
      transform:scale(1.12,.9) rotate(3deg);
    }

    72%{
      transform:scale(.9,1.1) rotate(-2deg);
    }
  }

  .note{
    max-width:640px;

    width:100%;

    margin-top:4vh;

    font-family:'JetBrains Mono', monospace;

    font-size:.68rem;

    line-height:1.7;

    letter-spacing:.03em;

    color:var(--ash-dim);
  }

  @media (prefers-reduced-motion:reduce){
    .flame{
      animation:none;
    }
  }

  @media (max-width:520px){

    .paper-layer{
      padding:26px 22px;

      border-radius:10px;

      min-height:380px;
    }

    .surface{
      min-height:380px;

      border-radius:10px;
    }

    .burn-overlay{
      inset:26px 22px;
    }

    header{
      margin-bottom:5vh;
    }
  }
</style>
</head>

<body>

<canvas id="ambient"></canvas>

<div class="wrap">

  <header>
    <h1>Cinzas</h1>
    <span class="tag">nada fica</span>
  </header>

  <main>

    <div class="stage">

      <div class="surface" id="surface">

        <div class="paper-layer" id="paperLayer">

          <textarea
            id="editor"
            placeholder="Escreva o que você precisa soltar. Ninguém vai ler — nem você, depois."
          ></textarea>

          <div
            class="burn-overlay"
            id="overlay"
          ></div>

        </div>

        <div id="scorch"></div>

        <canvas id="embers"></canvas>

        <div class="aftermath" id="aftermath">
          <p>queimado. nada foi salvo.</p>
        </div>

      </div>

    </div>

    <footer>

      <span class="counter" id="counter">
        0 caracteres · 0 salvos, sempre
      </span>

      <button id="burnBtn" type="button" disabled>
        <span class="flame"></span>
        <span>queimar</span>
      </button>

    </footer>

  </main>

  <p class="note">
    Este app não tem banco de dados, não tem login, não envia nada pra lugar nenhum.
    O texto existe só na memória da sua aba, enquanto você escreve.
    Ao queimar — ou ao fechar a página — ele desaparece de verdade.
  </p>

</div>

<script>
(function(){

  const editor =
    document.getElementById('editor');

  const overlay =
    document.getElementById('overlay');

  const surface =
    document.getElementById('surface');

  const paperLayer =
    document.getElementById('paperLayer');

  const scorch =
    document.getElementById('scorch');

  const burnBtn =
    document.getElementById('burnBtn');

  const counter =
    document.getElementById('counter');

  const aftermath =
    document.getElementById('aftermath');

  const canvas =
    document.getElementById('embers');

  const ctx =
    canvas.getContext('2d');

  const reducedMotion =
    window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;


  /*
  ============================================================
  CANVAS
  ============================================================
  */

  let dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  function resizeCanvas(){

    const rect =
      surface.getBoundingClientRect();

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    canvas.width =
      rect.width * dpr;

    canvas.height =
      rect.height * dpr;

    canvas.style.width =
      rect.width + 'px';

    canvas.style.height =
      rect.height + 'px';

    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );
  }

  window.addEventListener(
    'resize',
    resizeCanvas
  );

  resizeCanvas();


  /*
  ============================================================
  CONTADOR
  ============================================================
  */

  function updateCounter(){

    const n =
      editor.value.length;

    counter.textContent =
      n +
      (
        n === 1
          ? ' caractere'
          : ' caracteres'
      ) +
      ' · 0 salvos, sempre';

    burnBtn.disabled =
      n === 0;
  }

  editor.addEventListener(
    'input',
    updateCounter
  );

  updateCounter();


  /*
  ============================================================
  PARTICLE SYSTEM
  ============================================================
  */

  let fireParticles = [];
  let sparks = [];
  let smokeParticles = [];
  let ashParticles = [];

  let fireZones = [];


  function spawnFire(
    x,
    y,
    intensity = 1
  ){

    fireParticles.push({

      x,
      y,

      vx:
        (Math.random() - .5) *
        1.4,

      vy:
        -(
          1.3 +
          Math.random() * 2.8
        ) *
        intensity,

      size:
        (
          3 +
          Math.random() * 8
        ) *
        intensity,

      life:1,

      decay:
        .02 +
        Math.random() * .035,

      turbulence:
        .3 +
        Math.random() * .8,

      phase:
        Math.random() *
        Math.PI *
        2
    });
  }


  function spawnSpark(x,y){

    sparks.push({

      x,
      y,

      vx:
        (Math.random() - .5) *
        2.3,

      vy:
        -(
          1.3 +
          Math.random() * 3.2
        ),

      gravity:
        .025 +
        Math.random() * .025,

      size:
        .5 +
        Math.random() * 1.8,

      life:1,

      decay:
        .03 +
        Math.random() * .035
    });
  }


  function spawnSmoke(x,y){

    smokeParticles.push({

      x,
      y,

      vx:
        (Math.random() - .5) *
        .35,

      vy:
        -(
          .25 +
          Math.random() * .55
        ),

      size:
        4 +
        Math.random() * 8,

      life:
        .45 +
        Math.random() * .3,

      decay:
        .005 +
        Math.random() * .006,

      phase:
        Math.random() *
        Math.PI *
        2
    });
  }


  function spawnAsh(x,y){

    ashParticles.push({

      x,
      y,

      vx:
        (Math.random() - .7) *
        1.1,

      vy:
        -(
          .2 +
          Math.random() * 1.5
        ),

      gravity:
        .025 +
        Math.random() * .025,

      size:
        1 +
        Math.random() * 3.5,

      rotation:
        Math.random() *
        Math.PI *
        2,

      spin:
        (Math.random() - .5) *
        .12,

      life:1,

      decay:
        .008 +
        Math.random() * .01,

      dark:
        Math.random() > .35
    });
  }


  /*
  ============================================================
  CHAMA
  ============================================================
  */

  function drawFlame(p){

    const alpha =
      Math.max(
        0,
        p.life
      );

    const size =
      p.size *
      (.55 + p.life * .65);

    const wobble =
      Math.sin(
        p.phase +
        performance.now() * .008
      ) *
      size *
      .18;

    ctx.save();

    ctx.translate(
      p.x,
      p.y
    );

    ctx.rotate(
      p.vx * .08
    );


    /*
     * Glow.
     */

    const glow =
      ctx.createRadialGradient(
        0,
        0,
        0,
        0,
        0,
        size * 2.8
      );

    glow.addColorStop(
      0,
      `rgba(255,145,45,${.2 * alpha})`
    );

    glow.addColorStop(
      1,
      'rgba(255,60,0,0)'
    );

    ctx.fillStyle =
      glow;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      size * 2.8,
      0,
      Math.PI * 2
    );

    ctx.fill();


    /*
     * Corpo.
     */

    const gradient =
      ctx.createRadialGradient(
        wobble * .2,
        size * .35,
        0,
        wobble,
        -size * .2,
        size * 1.5
      );

    gradient.addColorStop(
      0,
      `rgba(255,248,190,${.98 * alpha})`
    );

    gradient.addColorStop(
      .16,
      `rgba(255,205,75,${.96 * alpha})`
    );

    gradient.addColorStop(
      .42,
      `rgba(255,105,22,${.88 * alpha})`
    );

    gradient.addColorStop(
      .72,
      `rgba(205,43,8,${.55 * alpha})`
    );

    gradient.addColorStop(
      1,
      'rgba(100,15,2,0)'
    );

    ctx.fillStyle =
      gradient;

    ctx.beginPath();

    ctx.moveTo(
      0,
      size * 1.1
    );

    ctx.bezierCurveTo(
      -size * .95,
      size * .45,

      -size * .65,
      -size * .35,

      wobble,
      -size * 1.55
    );

    ctx.bezierCurveTo(
      size * .2,
      -size * .75,

      size * .95,
      -.1 * size,

      size * .55,
      size * .55
    );

    ctx.bezierCurveTo(
      size * .35,
      size * .9,

      size * .15,
      size * 1.05,

      0,
      size * 1.1
    );

    ctx.fill();

    ctx.restore();
  }


  /*
  ============================================================
  MÁSCARA DO PAPEL
  ============================================================
  */

  /*
   * Cria uma máscara SVG dinâmica.
   *
   * O branco mantém o papel.
   * As regiões pretas viram transparência.
   *
   * É isso que faz o papel literalmente desaparecer.
   */

  function updatePaperMask(
    width,
    height,
    progress,
    zones
  ){

    if(!zones.length)
      return;


    const holes = [];

    /*
     * Cada zona abre uma região irregular
     * no papel conforme o fogo avança.
     */

    zones.forEach((zone,index) => {

      const x =
        zone.x;

      const y =
        zone.y;

      const radius =
        24 +
        progress * 48 +
        zone.width * .55;


      /*
       * Vários círculos sobrepostos deixam
       * a borda menos geométrica.
       */

      holes.push(
        `
        <ellipse
          cx="${x}"
          cy="${y}"
          rx="${radius * 1.35}"
          ry="${radius * .7}"
          fill="black"
        />
        `
      );

      for(let i=0;i<3;i++){

        const offsetX =
          (Math.random() - .5) *
          radius *
          .8;

        const offsetY =
          (Math.random() - .5) *
          radius *
          .5;

        const r =
          radius *
          (
            .35 +
            Math.random() * .45
          );

        holes.push(
          `
          <circle
            cx="${x + offsetX}"
            cy="${y + offsetY}"
            r="${r}"
            fill="black"
          />
          `
        );
      }
    });


    const svg = `
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="${width}"
        height="${height}"
        viewBox="0 0 ${width} ${height}"
      >

        <mask id="m">

          <rect
            width="100%"
            height="100%"
            fill="white"
          />

          ${holes.join('')}

        </mask>

        <rect
          width="100%"
          height="100%"
          fill="white"
          mask="url(#m)"
        />

      </svg>
    `;


    const encoded =
      'data:image/svg+xml;charset=utf-8,' +
      encodeURIComponent(svg);


    paperLayer.style.webkitMaskImage =
      `url("${encoded}")`;

    paperLayer.style.maskImage =
      `url("${encoded}")`;
  }


  /*
  ============================================================
  ATUALIZA FOGO
  ============================================================
  */

  function updateParticles(){

    /*
     * Fogo.
     */

    fireZones.forEach(zone => {

      zone.phase += .03;

      const wobble =
        Math.sin(
          zone.phase +
          performance.now() * .002
        ) *
        zone.width *
        .45;

      const x =
        zone.x +
        wobble;

      const y =
        zone.y;

      const amount =
        Math.random() < .65
          ? 1
          : 2;

      for(let i=0;i<amount;i++){

        spawnFire(
          x +
          (Math.random() - .5) *
          zone.width,

          y,

          zone.intensity
        );
      }

      if(Math.random() < .12){

        spawnSpark(
          x,
          y
        );
      }

      if(Math.random() < .025){

        spawnSmoke(
          x,
          y - 10
        );
      }
    });


    fireParticles.forEach(p => {

      p.phase += .04;

      p.vx +=
        Math.sin(
          p.phase +
          p.y * .025
        ) *
        .008 *
        p.turbulence;

      p.vy -= .012;

      p.x += p.vx;
      p.y += p.vy;

      p.life -= p.decay;

      if(p.life > 0){

        drawFlame(p);
      }
    });

    fireParticles =
      fireParticles.filter(
        p => p.life > 0
      );


    /*
     * Sparks.
     */

    sparks.forEach(p => {

      p.vy += p.gravity;

      p.x += p.vx;
      p.y += p.vy;

      p.life -= p.decay;

      if(p.life > 0){

        ctx.save();

        ctx.globalCompositeOperation =
          'lighter';

        ctx.shadowColor =
          `rgba(255,130,30,${p.life})`;

        ctx.shadowBlur = 7;

        ctx.fillStyle =
          `rgba(255,190,80,${p.life})`;

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
      }
    });

    sparks =
      sparks.filter(
        p => p.life > 0
      );


    /*
     * Fumaça.
     */

    smokeParticles.forEach(p => {

      p.x +=
        p.vx +
        Math.sin(
          performance.now() * .001 +
          p.phase
        ) *
        .12;

      p.y += p.vy;

      p.size += .018;

      p.life -= p.decay;

      if(p.life > 0){

        ctx.save();

        ctx.globalAlpha =
          p.life * .18;

        ctx.fillStyle =
          '#4b4035';

        ctx.filter =
          `blur(${Math.max(
            2,
            p.size * .3
          )}px)`;

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
      }
    });

    smokeParticles =
      smokeParticles.filter(
        p => p.life > 0
      );


    /*
     * Cinzas.
     */

    ashParticles.forEach(p => {

      p.vy += p.gravity;

      p.x +=
        p.vx +
        Math.sin(
          p.y * .03
        ) *
        .15;

      p.y += p.vy;

      p.rotation += p.spin;

      p.life -= p.decay;

      if(p.life > 0){

        ctx.save();

        ctx.translate(
          p.x,
          p.y
        );

        ctx.rotate(
          p.rotation
        );

        ctx.globalAlpha =
          p.life;

        ctx.fillStyle =
          p.dark
            ? 'rgba(48,37,27,.75)'
            : 'rgba(120,105,82,.65)';

        ctx.fillRect(
          -p.size / 2,
          -p.size / 2,
          p.size,
          p.size * .7
        );

        ctx.restore();
      }
    });

    ashParticles =
      ashParticles.filter(
        p => p.life > 0
      );
  }


  /*
  ============================================================
  QUEIMA
  ============================================================
  */

  function burn(){

    if(
      !editor.value ||
      burnBtn.disabled
    )
      return;


    burnBtn.disabled = true;

    surface.classList.add(
      'burning'
    );


    const text =
      editor.value;


    /*
     * Cópia visual.
     */

    overlay.textContent =
      text;

    overlay.style.display =
      'block';

    editor.style.visibility =
      'hidden';


    const overlayRect =
      overlay.getBoundingClientRect();

    const surfaceRect =
      surface.getBoundingClientRect();


    const offsetX =
      overlayRect.left -
      surfaceRect.left;

    const offsetY =
      overlayRect.top -
      surfaceRect.top;

    const width =
      overlayRect.width;

    const height =
      overlayRect.height;


    /*
     * Zonas de combustão.
     */

    const zoneCount =
      Math.max(
        9,
        Math.floor(
          width / 38
        )
      );


    fireZones = [];


    for(let i=0;i<zoneCount;i++){

      fireZones.push({

        x:
          offsetX +
          (
            i /
            (zoneCount - 1)
          ) *
          width +
          (
            Math.random() - .5
          ) *
          22,

        y:
          offsetY +
          height -
          8 -
          Math.random() * 12,

        width:
          16 +
          Math.random() * 30,

        intensity:
          .65 +
          Math.random() * .35,

        phase:
          Math.random() *
          Math.PI *
          2
      });
    }


    /*
     * A experiência inteira dura ~3 segundos.
     */

    const duration =
      reducedMotion
        ? 500
        : 2850;


    const start =
      performance.now();


    function frame(now){

      const elapsed =
        now - start;

      const raw =
        Math.min(
          elapsed / duration,
          1
        );


      /*
       * Ease-in-out.
       */

      const progress =
        raw < .5
          ? 2 * raw * raw
          : 1 -
            Math.pow(
              -2 * raw + 2,
              2
            ) / 2;


      /*
       * Fogo sobe.

       * Cada zona tem pequenas diferenças,
       * então nunca parece uma lâmina reta.
       */

      fireZones.forEach(
        (zone,index) => {

          const variation =
            Math.sin(
              index * 1.7 +
              now * .0016
            ) *
            15;

          zone.y =
            offsetY +
            height -
            progress * height +
            variation;
        }
      );


      /*
       * Atualiza a máscara do papel.
       *
       * A cada frame a região atrás do fogo
       * vai sendo removida.
       */

      if(!reducedMotion){

        updatePaperMask(
          surface.clientWidth,
          surface.clientHeight,
          progress,
          fireZones
        );
      }


      /*
       * Escurece o texto antes dele desaparecer.
       */

      overlay.style.filter =
        `
          contrast(${1 + progress * .3})
          brightness(${1 - progress * .72})
          saturate(${1 - progress * .8})
        `;


      /*
       * Gradiente de queimadura.
       */

      const scorchGradients =
        fireZones.map(zone => {

          const radius =
            40 +
            progress * 55;

          return `
            radial-gradient(
              ellipse
              ${radius}px
              ${radius * .6}px
              at
              ${zone.x}px
              ${zone.y}px,
              rgba(45,20,7,.55),
              rgba(80,30,8,.22) 35%,
              transparent 75%
            )
          `;
        });


      scorch.style.background =
        scorchGradients.join(',');


      /*
       * Canvas.
       */

      ctx.clearRect(
        0,
        0,
        canvas.width / dpr,
        canvas.height / dpr
      );

      ctx.globalCompositeOperation =
        'lighter';

      updateParticles();

      ctx.globalCompositeOperation =
        'source-over';


      /*
       * Cinzas começam a cair/subir
       * no segundo final.
       */

      if(
        !reducedMotion &&
        progress > .55 &&
        Math.random() < .18
      ){

        const zone =
          fireZones[
            Math.floor(
              Math.random() *
              fireZones.length
            )
          ];

        spawnAsh(
          zone.x +
          (
            Math.random() - .5
          ) * 25,

          zone.y +
          Math.random() * 10
        );
      }


      if(raw < 1){

        requestAnimationFrame(
          frame
        );

      }else{

        finish(
          offsetX,
          offsetY,
          width,
          height
        );
      }
    }


    requestAnimationFrame(
      frame
    );
  }


  /*
  ============================================================
  FINAL
  ============================================================
  */

  function finish(
    offsetX,
    offsetY,
    width,
    height
  ){

    /*
     * Só algumas cinzas.
     * Nada de funeral de 4 segundos.
     */

    if(!reducedMotion){

      for(let i=0;i<14;i++){

        spawnAsh(
          offsetX +
          Math.random() *
          width,

          offsetY +
          height * .35 +
          Math.random() *
          height * .45
        );
      }


      for(let i=0;i<8;i++){

        spawnSpark(
          offsetX +
          Math.random() *
          width,

          offsetY +
          height * .3 +
          Math.random() *
          height * .5
        );
      }
    }


    /*
     * O conteúdo deixa de existir.
     */

    editor.value = '';

    overlay.textContent = '';

    overlay.style.display =
      'none';


    /*
     * Remove o restante do papel.
     */

    paperLayer.style.webkitMaskImage =
      'none';

    paperLayer.style.maskImage =
      'none';

    paperLayer.style.opacity =
      '0';


    /*
     * Remove a queimadura.
     */

    scorch.style.opacity =
      '0';


    /*
     * Mensagem entra rapidamente.
     */

    setTimeout(() => {

      surface.classList.remove(
        'burning'
      );

      aftermath.style.transition =
        'opacity .45s ease';

      aftermath.style.opacity =
        '1';


      /*
       * Só 1 segundo de silêncio.
       */

      setTimeout(() => {

        aftermath.style.opacity =
          '0';


        setTimeout(() => {

          paperLayer.style.opacity =
            '1';

          scorch.style.background =
            'none';

          scorch.style.opacity =
            '';

          editor.style.visibility =
            'visible';

          updateCounter();

          editor.focus();

        }, 450);

      }, 900);

    }, 120);


    /*
     * Últimas cinzas.
     */

    const cleanupStart =
      performance.now();


    function cleanup(now){

      ctx.clearRect(
        0,
        0,
        canvas.width / dpr,
        canvas.height / dpr
      );

      ctx.globalCompositeOperation =
        'lighter';

      updateParticles();

      ctx.globalCompositeOperation =
        'source-over';


      /*
       * A limpeza termina rápido.
       */

      if(
        now -
        cleanupStart <
        1100
      ){

        requestAnimationFrame(
          cleanup
        );

      }else{

        fireParticles = [];
        sparks = [];
        smokeParticles = [];
        ashParticles = [];

        ctx.clearRect(
          0,
          0,
          canvas.width / dpr,
          canvas.height / dpr
        );
      }
    }


    requestAnimationFrame(
      cleanup
    );
  }


  burnBtn.addEventListener(
    'click',
    burn
  );


  /*
  ============================================================
  SEGURANÇA
  ============================================================
  */

  window.addEventListener(
    'beforeunload',
    () => {
      editor.value = '';
    }
  );


  /*
  ============================================================
  EMBRAS AMBIENTAIS
  ============================================================
  */

  const ambient =
    document.getElementById(
      'ambient'
    );

  const actx =
    ambient.getContext('2d');

  let ambientParticles = [];


  function sizeAmbient(){

    ambient.width =
      window.innerWidth * dpr;

    ambient.height =
      window.innerHeight * dpr;

    ambient.style.width =
      window.innerWidth + 'px';

    ambient.style.height =
      window.innerHeight + 'px';

    actx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );
  }


  window.addEventListener(
    'resize',
    sizeAmbient
  );

  sizeAmbient();


  function spawnAmbient(){

    if(
      ambientParticles.length >= 26
    )
      return;

    if(
      Math.random() > .06
    )
      return;


    ambientParticles.push({

      x:
        Math.random() *
        window.innerWidth,

      y:
        window.innerHeight + 10,

      vx:
        (
          Math.random() - .5
        ) * .15,

      vy:
        -(
          .15 +
          Math.random() * .3
        ),

      size:
        .6 +
        Math.random() * 1.4,

      life:
        .15 +
        Math.random() * .35,

      decay:
        .0006 +
        Math.random() * .001
    });
  }


  function ambientLoop(){

    actx.clearRect(
      0,
      0,
      ambient.width,
      ambient.height
    );

    spawnAmbient();


    ambientParticles.forEach(p => {

      p.x += p.vx;
      p.y += p.vy;

      p.life -= p.decay;

      if(p.life > 0){

        actx.beginPath();

        actx.fillStyle =
          `rgba(
            224,
            85,
            31,
            ${Math.max(
              p.life,
              0
            )}
          )`;

        actx.shadowColor =
          'rgba(224,85,31,.45)';

        actx.shadowBlur =
          5;

        actx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );

        actx.fill();
      }
    });


    ambientParticles =
      ambientParticles.filter(
        p =>
          p.life > 0 &&
          p.y > -10
      );


    requestAnimationFrame(
      ambientLoop
    );
  }


  if(!reducedMotion){

    ambientLoop();
  }

})();
</script>
